<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="runeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
  </defs>

  <!-- Background Shield -->
  <rect width="64" height="64" rx="14" fill="#0b0f17"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Outer Aura Glow -->
  <circle cx="32" cy="32" r="28" fill="url(#glow)"/>
  
  <!-- Mystical Wild Rune / Sprout Symbol -->
  <!-- Left Wing / Leaf -->
  <path d="M32 50 C20 44 14 32 18 18 C26 20 30 26 32 34 Z" fill="url(#leafGrad)"/>
  
  <!-- Right Wing / Leaf -->
  <path d="M32 50 C44 44 50 32 46 18 C38 20 34 26 32 34 Z" fill="url(#leafGrad)"/>
  
  <!-- Central Luminous Cepa / Seed Core -->
  <path d="M32 12 L38 28 L32 46 L26 28 Z" fill="url(#goldGrad)"/>
  
  <!-- Inner Core Spark -->
  <polygon points="32,20 35,28 32,36 29,28" fill="#ffffff"/>
  <circle cx="32" cy="28" r="2" fill="url(#runeGrad)"/>
</svg>
